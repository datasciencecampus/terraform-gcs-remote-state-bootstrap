
name: CI

on:
  push:
  pull_request:
    branches: ["main"]

env:
  TERRAFORM_VERSION: "1.14.7"

permissions:
  contents: read

jobs:
  tf-fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run terraform fmt
        run: terraform fmt -recursive -check -diff
  # TEMPORARILY DISABLED DUE TO SECURITY INCIDENT
  # trivy:
  #   name: trivy
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
  #     - name: Trivy scan
  #       uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
  #       with:
  #         scan-type: fs
  #         scan-ref: .
  #         trivy-config: configs/trivy.yaml
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@dfb51aed1b783289b0d3f255028e7a88d5e8caa1 # v12
        with:
          directory: .
          config_file: configs/checkov.yml

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: TFLint scan
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
      - name: Run TFLint
        run: tflint --config=configs/.tflint.hcl

  validate-and-check-docs:
    name: Validate and check docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: Run terraform validate
        run: |
          terraform init -backend=false
          terraform validate

      - name: Run terraform docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: .
          output-file: README.md
          output-format: markdown

      - name: Check for diffs
        run: |
          git diff --exit-code README.md || {
            echo "README.md has uncommitted changes. Please run terraform-docs and commit the updated docs.";
            exit 1;
          }
        continue-on-error: false
